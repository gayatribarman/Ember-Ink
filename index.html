<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember & Ink | Books & Poetry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Ember & Ink</h1>
      <p class="subtitle">where books meet poetry</p>
    </header>

    <div class="form-card">
      <h2>Add to your library</h2>
      <input type="text" id="bookTitle" placeholder="Book title" autocomplete="off">
      <input type="text" id="bookAuthor" placeholder="Author">
      <textarea id="bookPoem" rows="3" placeholder="Your poem or note about this book..."></textarea>
      <button id="addBtn">Add to Ember & Ink</button>
    </div>

    <div class="search-card">
      <input type="text" id="searchInput" placeholder="Search by title or poem">
    </div>

    <div class="books-grid" id="booksGrid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
